[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-desktop"
version = "0.1.0"
description = "Local-first multimodal desktop AI companion"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ollama>=0.6.0",
  "mss>=10.0.0",
  "Pillow>=11.0.0",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
